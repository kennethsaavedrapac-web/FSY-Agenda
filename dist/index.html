    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var qTheme = params.get('theme');
          if (qTheme === 'light' || qTheme === 'dark' || qTheme === 'auto') {
            localStorage.setItem('fsy_theme', qTheme);
          }
          var saved = localStorage.getItem('fsy_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'auto') && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', isDark ? '#0B1220' : '#0284C7');
          }
        } catch (e) {}
      })();
    </script>
